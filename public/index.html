<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketFlow — Automated Supermarket Management System</title>
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <div class="sidebar-brand">
        <div class="sidebar-logo-mark">
          <i class="bi bi-cart-check-fill"></i>
        </div>
        <div>
          <div class="fw-bold" style="font-size: 16px; line-height: 1.2;">MarketFlow</div>
          <div id="sidebarStoreName" style="font-size: 12px; opacity: 0.78;">Supermarket POS</div>
        </div>
      </div>

      <nav id="sidebarNav" class="sidebar-nav"></nav>

      <div class="sidebar-footer">
        <div class="fw-semibold text-white" id="sidebarUserName">Loading...</div>
        <div id="sidebarUserRole" style="opacity: 0.8;">Role</div>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="d-flex align-items-center gap-3">
          <button id="mobileMenuBtn" class="btn btn-outline-secondary d-lg-none" type="button" aria-label="Toggle navigation">
            <i class="bi bi-list fs-5"></i>
          </button>
          <div>
            <h1 id="topbarTitle" class="h5 mb-0">MarketFlow</h1>
            <div id="topbarSubtitle" class="text-muted" style="font-size: 12px;">Automated Supermarket Operations</div>
          </div>
        </div>

        <div class="d-flex align-items-center gap-2">
          <button id="quickPosBtn" class="btn btn-primary btn-sm d-none" type="button">
            <i class="bi bi-upc-scan"></i> Open POS
          </button>
          <span id="topbarRoleBadge" class="badge-status badge-status-info d-none d-sm-inline-flex"></span>
          <button id="logoutBtn" class="btn btn-outline-secondary btn-sm" type="button">
            <i class="bi bi-box-arrow-right"></i> <span class="d-none d-sm-inline">Sign Out</span>
          </button>
        </div>
      </header>

      <main id="mainContent" class="workspace-content">
        <div class="text-center py-5 text-muted">
          <div class="spinner-border text-success mb-2" role="status"></div>
          <div>Loading MarketFlow workspace...</div>
        </div>
      </main>
    </div>
  </div>

  <!-- Confirmation Modal -->
  <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="confirmModalTitle">Confirm Action</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="confirmModalMessage" class="mb-2"></p>
          <div id="confirmReasonWrap" class="d-none mt-3">
            <label for="confirmReasonInput" class="form-label fw-semibold" id="confirmReasonLabel">Reason</label>
            <input type="text" class="form-control" id="confirmReasonInput" placeholder="Enter required reason...">
            <div id="confirmReasonError" class="text-danger mt-1 d-none" style="font-size: 12px;">Reason is required.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="confirmModalBtn">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Receipt Modal -->
  <div class="modal fade" id="receiptModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header no-print">
          <h5 class="modal-title"><i class="bi bi-receipt me-2 text-success"></i>Transaction Receipt</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="receiptPrintArea"></div>
        <div class="modal-footer no-print">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" id="printReceiptBtn">
            <i class="bi bi-printer"></i> Print Receipt
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Dynamic Feature Modal (reused cleanly for forms) -->
  <div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" id="appModalDialog">
      <div class="modal-content" id="appModalContent"></div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1090;"></div>

  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/vendor/chart.js/chart.umd.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/pos.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/inventory.js"></script>
  <script src="/js/suppliers.js"></script>
  <script src="/js/sales.js"></script>
  <script src="/js/reports.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
